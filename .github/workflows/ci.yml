name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
  # Allow release.yml to gate on this exact suite before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pytest (network-free driver + Arrow batch builders via injected fakes), ruff, mypy.
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Type check (mypy)
        run: uv run mypy vgi_etf_schwab/
      - name: Tests
        run: uv run pytest -q

  # SQLLogic (haybarn) E2E: the worker attached to a real DuckDB with the vgi extension
  # from the community repository. Bind-time schema asserts are deterministic; the
  # live-invariant asserts hit Schwab in-process through curl_cffi's Chrome TLS
  # impersonation — an egress connector, so network is expected.
  e2e:
    name: SQLLogic e2e (haybarn)
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install worker environment
        run: uv sync --extra dev
      - name: Install the haybarn unittest runner
        run: |
          uv tool install 'haybarn-unittest<2'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the vgi community extension
        run: echo "INSTALL vgi FROM community;" | uvx --from 'haybarn-cli<2' haybarn-cli
      - name: Run SQLLogic suite against the worker
        run: ./run_tests.sh

  # Metadata-quality gate (vgi-lint): scores the worker's catalog/schema/function docs,
  # tags, categories, per-arg docs, and examples. --no-execute keeps it deterministic —
  # live-network behavior is covered by the e2e job. fail-on info = strict.
  lint:
    name: metadata quality (vgi-lint)
    runs-on: ubuntu-latest
    env:
      # uv otherwise picks the newest CPython (3.15), which lacks wheels for native deps.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install worker environment
        run: uv sync --extra dev
      - name: vgi-lint
        run: >
          uvx --prerelease allow --from vgi-lint-check vgi-lint
          "${{ github.workspace }}/bin/vgi-etf-schwab-worker"
          --fail-on info --no-execute
