# Private graders for `vgi-lint simulate` (VGI416). The worker publishes only
# task names and prompts in vgi.agent_test_tasks; these canonical solutions and
# grading options stay in the repo and are merged by task name.
tasks:
  - name: schd_exists
    check_sql: "SELECT count(*) > 0 FROM schwab.main.products WHERE ticker = 'SCHD'"
    success_criteria: "The answer confirms SCHD is the Schwab U.S. Dividend Equity ETF, found via the products table."
  - name: schd_expense_ratio
    check_sql: "SELECT count(*) > 0 FROM schwab.main.products WHERE ticker = 'SCHD' AND expense_ratio_percent IS NOT NULL"
    success_criteria: "The answer reports SCHD's expense ratio (a small percentage) from the products table."
  - name: schd_top_holding
    check_sql: "SELECT count(*) > 0 FROM schwab.main.holdings WHERE fund_ticker = 'SCHD'"
    success_criteria: "The answer names SCHD's top holding by weight, obtained from the holdings table."
  - name: schd_holdings_scan
    check_sql: "SELECT count(*) > 0 FROM schwab.main.holdings_scan(fund_ticker => 'SCHD')"
    success_criteria: "The answer returns SCHD constituents via holdings_scan(fund_ticker => 'SCHD')."
