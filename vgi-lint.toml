[tool.vgi-lint-check]
select = ["ALL"]
fail_on = "info"


[tool.vgi-lint-check.execution]
# The `holdings` scan fetches a full fund's holdings pages LIVE from Schwab (through the
# curl_cffi Chrome-TLS transport that clears Akamai) before emitting the first partition
# batch, so the VGI911 `SELECT * FROM holdings LIMIT 10` probe legitimately needs more than
# the default 10s scan window — a fund can span several paginated requests. This widens the
# window only (it hides no finding); concurrency=1 keeps the probe gentle on Akamai (a burst
# of parallel requests draws a 403). CI runs the lint gate with --no-execute and covers live
# execution in the separate haybarn e2e job, so this affects only local `--execute` runs.
scan_timeout = 120
timeout = 120
concurrency = 1

# holdings has no primary key. Under vgi.v3 DuckDB trusts every declared key (only
# ENFORCED + ALL_ROWS records are accepted), and Schwab's feed can list one CUSIP more than
# once per fund under different as-of dates (seen live on SCHZ, 2026-11-06), so the old
# advisory (fund_ticker, cusip) key would be a false claim. fund_ticker and cusip keep their
# NOT NULL records; only VGI807 is waived, and only for this table.
[tool.vgi-lint-check.per_object."schwab.main.holdings"]
ignore = [
    { code = "VGI807", kind = "domain-exemption", reason = "Schwab holdings have no reliable row identity: one CUSIP can appear more than once per fund under different as-of dates, and vgi.v3 makes DuckDB trust any declared key." },
]
