[tool.vgi-lint-check]
select = ["ALL"]
fail_on = "info"

[tool.vgi-lint-check.options]
column_comment_min_ratio = 0.8

[tool.vgi-lint-check.execution]
# The `holdings` scan fetches a full fund's holdings pages LIVE from Schwab (through the
# curl_cffi Chrome-TLS transport that clears Akamai) before emitting the first partition
# batch, so the VGI911 `SELECT * FROM holdings LIMIT 10` probe legitimately needs more than
# the default 10s scan window — a fund can span several paginated requests. This widens the
# window only (it hides no finding); concurrency=1 keeps the probe gentle on Akamai (a burst
# of parallel requests draws a 403). CI runs the lint gate with --no-execute and covers live
# execution in the separate haybarn e2e job, so this affects only local `--execute` runs.
scan_timeout = 120
timeout = 120
concurrency = 1
